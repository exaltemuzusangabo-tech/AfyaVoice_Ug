name: afya_voice
description: "AfyaVoice - Voice-first maternal health triage mobile application designed for low-bandwidth East African environments (targeting SDGs 3, 5, and 10)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System (Material 3 + Animations)
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Audio & Voice Processing
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

  # Network & Google Gemini AI API
  http: ^1.2.1

  # Location & Clinic Navigation
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0

  # Local Persistence & Offline Resilience
  shared_preferences: ^2.2.3

  # Icons & Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/
